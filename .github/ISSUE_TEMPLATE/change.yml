name: Change proposal
description: A feature or design change. Becomes an OpenSpec change before code.
labels: [spec]
body:
  - type: textarea
    id: outcome
    attributes:
      label: User-visible outcome
      description: State it as a command someone can run, or a behaviour they can observe.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable behavior would demonstrate that this is solved?
    validations:
      required: true
  - type: markdown
    attributes:
      value: A maintainer will triage this issue. The OpenSpec planning PR must merge before implementation starts.
