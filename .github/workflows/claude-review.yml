name: Claude review

# Automated PR review on every push to a PR, no @claude mention needed.
# Two passes:
#   1. Bug hunt: the Anthropic code-review plugin posts inline comments.
#   2. Spec conformance: a second run checks the diff against the OpenSpec
#      change named in the PR and the rules in .claude/rules/.
# Requires the `claude` GitHub App on the repo and one
# secret: ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`).
# Interactive help stays available: comment `@claude ...` on any PR or issue.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Bug hunt (inline comments)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Require ANTHROPIC_API_KEY
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret is not set; see docs/RELEASING.md step 5"; exit 1; }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --max-turns 40'

  conformance:
    name: Spec conformance
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Require ANTHROPIC_API_KEY
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret is not set; see docs/RELEASING.md step 5"; exit 1; }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the conformance reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow .claude/skills/review-pr/SKILL.md exactly. In short:
            1. Read the PR body and find the OpenSpec change it names under openspec/changes/. If a major path changed and no change is named, say so.
            2. Read that change's proposal.md, tasks.md and specs/. Compare the diff (git diff origin/${{ github.base_ref }}...HEAD) against it: every new behaviour must map to a scenario, every scenario to a test.
            3. Check the diff against the rules in .claude/rules/. Use only files in this checkout; do not initialize submodules or fetch external context.
            4. Check CHANGELOG.md was updated for user-visible changes and the version, if bumped, has a section.
            5. Post ONE review comment with `gh pr comment`: a short verdict line (PASS / WARN / BLOCK), then findings as `path:line: severity: problem. fix.` Skip praise. Under 40 lines.
          claude_args: '--allowedTools "Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob" --max-turns 30'

  mention:
    name: "@claude on demand"
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Require ANTHROPIC_API_KEY
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$API_KEY" || { echo "::error::ANTHROPIC_API_KEY secret is not set; see docs/RELEASING.md step 5"; exit 1; }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Handle the requested task using local docs and specs. Do not fetch external context or initialize submodules."
          claude_args: "--max-turns 60"
