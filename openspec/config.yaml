schema: spec-driven

context: |
  Python 3.11+ CLI and library built from the csuf-fullerton. Pure logic in
  src/<pkg>/core/ (no I/O, no logging, no env); thin adapters in cli/. Typer + Rich.
  Tests: pytest, known-answer fixtures, network tests marked and excluded from CI.
  No change to src/, .github/, .claude/, Dockerfile or pyproject.toml ships without a
  change folder here. Releases are version-gated pushes to main.

rules:
  proposal:
    - Identify the GitHub issue; this is a planning-only PR that must merge before implementation.
    - State the user-visible outcome first, as a command someone can run.
    - Always include a "Non-goals" section.
    - Link every prior change and external source relied on; no bare names.
  tasks:
    - Break tasks into chunks of at most ~2 hours, each with one coherent commit; group 1–3 related tasks per PR.
    - Every capability task names the test that proves it.
  specs:
    - Every requirement has at least one "#### Scenario:" with WHEN / THEN lines.

operations:
  apply:
    guidance:
      - First verify the linked issue and planning PR merged into the default branch.
      - Work one task per coherent commit; run relevant checks before ticking a box.
      - Add the CHANGELOG [Unreleased] line in the same commit as the code.
  archive:
    guidance:
      - Archive only after the PR merged and the spec deltas are synced to openspec/specs.
