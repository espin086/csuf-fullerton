# Theory priors for the Nicaragua small-open-economy SVAR.
# prior = exogenous | candidate | endogenous. Every prior carries its argument and a source,
# so a reader can disagree with a specific line rather than with the whole model.

[meta]
country = "Nicaragua"
frequency = "M"
deterministic = { trend = true, seasonal = true }   # IP and CPI are not seasonally adjusted

[[variable]]
name = "ffr"
prior = "exogenous"
rationale = "U.S. policy rate. Nicaragua's GDP is roughly 0.06% of U.S. GDP; the FOMC does not react to it."
source = "Cushman and Zha (1997); Maćkowiak (2007)"

[[variable]]
name = "us_ip"
prior = "exogenous"
rationale = "U.S. activity is Nicaragua's main export demand; no plausible feedback from Nicaraguan output."
source = "Cushman and Zha (1997); Maćkowiak (2007)"

[[variable]]
name = "commodity"
prior = "exogenous"
rationale = "World commodity prices; Nicaragua is a price taker in coffee, beef, gold and oil."
source = "Kim and Roubini (2000); Maćkowiak (2007)"

[[variable]]
name = "ni_er"
prior = "candidate"
rationale = "Cordoba per dollar under a pre-announced crawling peg (5% a year over this sample). The path is set by rule, so it may be predetermined with respect to monthly domestic shocks."
source = "Banco Central de Nicaragua exchange-rate regime; Calvo and Reinhart (2002) on pegs"

[[variable]]
name = "ni_ip"
prior = "endogenous"
rationale = "Domestic activity."
source = ""

[[variable]]
name = "ni_cpi"
prior = "endogenous"
rationale = "Domestic prices."
source = ""

[[variable]]
name = "ni_m2"
prior = "endogenous"
rationale = "Broad money; under a peg it adjusts endogenously to money demand and reserves."
source = "Obstfeld and Rogoff (1995) on money under fixed exchange rates"

[candidates]
min_foreign = 1
max_foreign = 4

# Thesis-style split stated explicitly so it is always in the table.
[[spec]]
name = "thesis"
foreign = ["ffr", "us_ip", "commodity"]

# Alternative recursive orderings of the domestic block, for robustness only. They have the
# same likelihood as the default ordering, so only theory can rank them.
[[ordering]]
domestic = ["ni_er", "ni_ip", "ni_cpi", "ni_m2"]

[[ordering]]
domestic = ["ni_m2", "ni_ip", "ni_cpi", "ni_er"]

[[ordering]]
domestic = ["ni_cpi", "ni_ip", "ni_m2", "ni_er"]

[[headline]]
response = "ni_ip"
shock = "ffr"

[[headline]]
response = "ni_cpi"
shock = "ffr"

[[headline]]
response = "ni_ip"
shock = "us_ip"

[[headline]]
response = "ni_cpi"
shock = "commodity"
