[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csuf-fullerton"
dynamic = ["version"]
description = "Block-exogenous SVAR estimation with theory-plus-data exogeneity screening for small open economies."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Project Authors" }]
keywords = ["template", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "typer>=0.12",
  "rich>=15.0.0",
  "pydantic>=2.13.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14.2",
  "matplotlib>=3.8",
  "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "mypy>=2.4.0",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.2",
]

[project.scripts]
csuf-fullerton = "csuf_fullerton.cli.main:app"

[project.urls]
Homepage = "https://github.com/espin086/template-python-cli"
Issues = "https://github.com/espin086/template-python-cli/issues"
Changelog = "https://github.com/espin086/template-python-cli/blob/main/CHANGELOG.md"
Source = "https://github.com/espin086/template-python-cli"

[tool.hatch.version]
path = "src/csuf_fullerton/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/csuf_fullerton"]

[tool.hatch.build.targets.sdist]
# Project context is design history, not distributable code.
exclude = ["context-lake", ".claude", ".agents", ".codex", "site", "templates", "openspec", ".github", "docs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: test requires live network access (deselect with '-m \"not network\"')",
]

[tool.coverage.run]
source = ["csuf_fullerton"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
".github/scripts/**" = ["S310"]

[tool.mypy]
python_version = "3.11"
packages = ["csuf_fullerton"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "matplotlib.*", "pandas.*", "keyring.*"]
ignore_missing_imports = true
